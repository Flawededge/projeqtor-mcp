server {
  listen 8080;
  server_name _;

  location /mcp {
    proxy_pass http://mcp:3000;
    proxy_http_version 1.1;
    proxy_set_header Host mcp;
    proxy_set_header X-Forwarded-Proto http;
    client_max_body_size 2m;
  }

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Host app;
    proxy_set_header X-Forwarded-Proto http;
  }
}
