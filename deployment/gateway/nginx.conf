worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
    default_type application/octet-stream;
    access_log /dev/stdout sanitized;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_x_forwarded_proto $projeqtor_forwarded_proto {
        default $scheme;
        https https;
        http http;
    }
    server {
        listen 8080;
        server_name _;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /projeqtor-auth { return 404; }
        location ^~ /projeqtor-auth/ { return 404; }
        location / {
            proxy_pass http://app:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }
    }
    server {
        listen 3000;
        server_name _;
        location = /projeqtor-auth/admin { return 404; }
        location ^~ /projeqtor-auth/admin/ { return 404; }
        location = /projeqtor-auth/realms/master { return 404; }
        location ^~ /projeqtor-auth/realms/master/ { return 404; }
        location = /projeqtor-auth/realms/projeqtor/clients-registrations { return 404; }
        location ^~ /projeqtor-auth/realms/projeqtor/clients-registrations/ { return 404; }
        location = /projeqtor-auth { return 404; }
        location ^~ /projeqtor-auth/ { return 404; }
        location = /.well-known/oauth-protected-resource/mcp_projeqtor {
            proxy_pass http://mcp:3000/.well-known/oauth-protected-resource/mcp_projeqtor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $projeqtor_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }
        location = /mcp_projeqtor {
            proxy_pass http://mcp:3000/mcp/oauth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $projeqtor_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / {
            proxy_pass http://mcp:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
