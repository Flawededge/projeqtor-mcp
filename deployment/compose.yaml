name: projeqtor
x-app-environment: &app-environment
  PROJEQTOR_DB_HOST: db
  PROJEQTOR_DB_PORT: "5432"
  PROJEQTOR_DB_NAME: projeqtor
  PROJEQTOR_DB_USER: projeqtor
  PROJEQTOR_DB_PASSWORD_FILE: /run/secrets/db_password
  PROJEQTOR_DISPLAY_NAME: ${PROJEQTOR_DISPLAY_NAME:-ProjeQtOr}
  PROJEQTOR_TIMEZONE: ${PROJEQTOR_TIMEZONE:-UTC}
  PROJEQTOR_MCP_TRUSTED_IP: ${PROJEQTOR_MCP_TRUSTED_IP:-172.31.84.13}
  PROJEQTOR_MCP_SIGNING_KEY_FILE: /run/secrets/mcp_signing_key
  PROJEQTOR_MCP_CURSOR_KEY_FILE: /run/secrets/mcp_cursor_key
  PROJEQTOR_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeqtor
      POSTGRES_USER: projeqtor
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/db-password:/run/secrets/db_password:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U projeqtor -d projeqtor"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
  auth-db-init:
    profiles: [oauth]
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    entrypoint: [/bin/sh, /auth/init-db.sh]
    volumes:
      - ./auth/init-db.sh:/auth/init-db.sh:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/db-password:/run/secrets/db_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/keycloak-db-password:/run/secrets/keycloak_db_password:ro
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  keycloak:
    profiles: [oauth]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c}
    restart: unless-stopped
    depends_on:
      auth-db-init: {condition: service_completed_successfully}
    user: "1000:1000"
    entrypoint: [/opt/keycloak/bin/oauth-entrypoint.sh]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-projeqtor-keycloak-admin}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /projeqtor-auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://conceptpower.ddns.net/projeqtor-auth}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://projeqtor/projeqtor-auth}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_CACHE: local
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      CLAUDE_OAUTH_REDIRECT_URI: ${CLAUDE_OAUTH_REDIRECT_URI:-}
    volumes:
      - ./auth/realm-projeqtor.json:/opt/keycloak/data/import/realm-projeqtor.json:ro
      - ./auth/user-profile.json:/opt/keycloak/conf/projeqtor-user-profile.json:ro
      - ./auth/keycloak-entrypoint.sh:/opt/keycloak/bin/oauth-entrypoint.sh:ro
      - ./auth/keycloak-healthcheck.sh:/opt/keycloak/bin/oauth-healthcheck.sh:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/keycloak-db-password:/run/secrets/keycloak_db_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/keycloak-admin-password:/run/secrets/keycloak_admin_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/entra-client-secret:/run/secrets/entra_client_secret:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/claude-oauth-client-secret:/run/secrets/claude_oauth_client_secret:ro
    networks: [backend, frontend]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /opt/keycloak/data/tmp:uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /opt/keycloak/bin/oauth-healthcheck.sh]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
  initialize:
    image: ${PROJEQTOR_APP_IMAGE:-ghcr.io/flawededge/projeqtor-mcp-app:2.1.0}
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
    environment: *app-environment
    command: [su, -s, /bin/sh, www-data, -c, "php /usr/local/lib/projeqtor/initialize.php"]
    volumes:
      - app-data:/var/lib/projeqtor
      - app-cache:/var/www/html/cache
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/db-password:/run/secrets/db_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-signing-key:/run/secrets/mcp_signing_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-cursor-key:/run/secrets/mcp_cursor_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/admin-password:/run/secrets/admin_password:ro
    networks: [backend]
    security_opt: [no-new-privileges:true]
  app:
    image: ${PROJEQTOR_APP_IMAGE:-ghcr.io/flawededge/projeqtor-mcp-app:2.1.0}
    restart: unless-stopped
    depends_on:
      initialize: {condition: service_completed_successfully}
    environment: *app-environment
    volumes:
      - app-data:/var/lib/projeqtor
      - app-cache:/var/www/html/cache
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/db-password:/run/secrets/db_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-signing-key:/run/secrets/mcp_signing_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-cursor-key:/run/secrets/mcp_cursor_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/api.htpasswd:/run/secrets/projeqtor-api-htpasswd:ro
    networks:
      backend:
        aliases: [projeqtor-app-backend]
      frontend:
    healthcheck:
      test: [CMD, curl, -fsS, -H, "Host: localhost", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]
  worker:
    image: ${PROJEQTOR_APP_IMAGE:-ghcr.io/flawededge/projeqtor-mcp-app:2.1.0}
    restart: unless-stopped
    depends_on:
      initialize: {condition: service_completed_successfully}
    user: "33:33"
    entrypoint: [/usr/local/bin/projeqtor-worker-entrypoint]
    environment: *app-environment
    volumes:
      - app-data:/var/lib/projeqtor
      - app-cache:/var/www/html/cache
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/db-password:/run/secrets/db_password:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-signing-key:/run/secrets/mcp_signing_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-cursor-key:/run/secrets/mcp_cursor_key:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, /usr/local/lib/projeqtor/worker-healthcheck.php]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
  mcp:
    image: ${PROJEQTOR_MCP_IMAGE:-ghcr.io/flawededge/projeqtor-mcp:2.1.0}
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      PORT: "3000"
      PROJEQTOR_API_URL: http://projeqtor-app-backend/mcp-api
      PROJEQTOR_SIGNING_KEY_FILE: /run/secrets/mcp_signing_key
      MCP_USERS_FILE: /run/secrets/mcp_users
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,mcp,gateway}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-localhost,127.0.0.1,mcp,gateway}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-https://conceptpower.ddns.net/projeqtor-auth/realms/projeqtor}
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-https://conceptpower.ddns.net/mcp_projeqtor}
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-http://keycloak:8080/projeqtor-auth/realms/projeqtor/protocol/openid-connect/certs}
      MCP_OAUTH_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-00000000-0000-4000-8000-000000000000}
      MCP_OAUTH_ALLOWED_DOMAINS: ${MCP_OAUTH_ALLOWED_DOMAINS:-hikoterra.com,pcnzl.com}
      MCP_OAUTH_REQUIRED_SCOPES: projeqtor:read projeqtor:write
    volumes:
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-signing-key:/run/secrets/mcp_signing_key:ro
      - ${PROJEQTOR_SECRETS_DIR:-./secrets}/mcp-users.json:/run/secrets/mcp_users:ro
    networks:
      backend:
        ipv4_address: ${PROJEQTOR_MCP_TRUSTED_IP:-172.31.84.13}
      frontend:
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/health]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
      mcp: {condition: service_healthy}
    user: "101:101"
    volumes: [./gateway/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports:
      - "${PROJEQTOR_BIND_ADDRESS:-127.0.0.1}:${PROJEQTOR_HTTP_PORT:-8080}:8080"
      - "${PROJEQTOR_BIND_ADDRESS:-127.0.0.1}:${PROJEQTOR_MCP_PORT:-3000}:3000"
    networks: [frontend]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${PROJEQTOR_BACKEND_SUBNET:-172.31.84.0/24}
volumes:
  db-data:
  app-data:
  app-cache:
