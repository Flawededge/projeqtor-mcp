name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Validate server syntax
        working-directory: server
        run: npm run check
      - name: Run server tests
        working-directory: server
        run: npm test
      - name: Prepare and validate disposable test topology
        working-directory: server
        run: |
          npm run harness:prepare
          npm run harness:config
      - name: Fetch checksum-pinned ProjeQtOr 13.1 source
        run: |
          curl -fL --retry 3 -o /tmp/projeqtor.zip https://sourceforge.net/projects/projectorria/files/projeqtorV13.1.0.zip/download
          echo "221c2a0b2facbdfc0b5af9878e030cdd7ded6e3f989b1da9cd609eccebaa0a69  /tmp/projeqtor.zip" | sha256sum -c -
          unzip -q /tmp/projeqtor.zip -d /tmp/projeqtor-source
      - name: Regenerate and verify complete policies
        run: php scripts/verify-coverage-v4.php /tmp/projeqtor-source/projeqtor
      - name: Build server image
        run: docker build --pull=false --tag projeqtor-mcp:ci server
      - name: Build application integration image
        run: docker build --pull=false --file deployment/app/Dockerfile --tag projeqtor-app:ci .
      - name: Validate every bridge and worker PHP file
        run: |
          find bridge worker scripts -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          test "$(jq '.sourceFileCount' bridge/source-inventory-v4.json)" -eq 944
          test "$(jq '.entrypointCount' bridge/ui-handler-policy-v4.json)" -eq 899
          test "$(jq '.mutationCandidateCount' bridge/ui-handler-policy-v4.json)" -eq 337
          test "$(jq '.unknownCount' bridge/ui-handler-policy-v4.json)" -eq 0
          test "$(jq '.deferredCount' bridge/ui-handler-policy-v4.json)" -eq 0
          test "$(jq '.expectedInstalledClassCount' bridge/class-policy-v4.json)" -eq 640
          test "$(jq '.unknownCount' bridge/class-policy-v4.json)" -eq 0
          test "$(jq '.activeUserFacingCount' bridge/active-menu-classes-v3.json)" -eq 229

  module-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - planning
          - ticketing
          - scrum
          - follow_up
          - steering
          - financial
          - products
          - hr
          - environment
          - tools
          - reports
          - configuration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate module contract
        run: node tests/run-suite.mjs module --module "${{ matrix.module }}" --dry-run

  disposable-integration:
    runs-on: ubuntu-latest
    needs: [validate, module-contracts]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Start fresh-data disposable stack
        working-directory: server
        env:
          BETA4_SEED_MODE: fresh
        run: |
          npm run harness:prepare
          npm run harness:up
      - name: Run disposable integration smoke
        working-directory: server
        run: npm run test:integration
      - name: Produce sanitized diagnostics
        if: always()
        working-directory: server
        run: npm run harness:sanitize || true
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta4-disposable-diagnostics
          path: tests/.runtime/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable stack and volumes
        if: always()
        working-directory: server
        run: npm run harness:down || true
